                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
      - recCmd_Delete:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.Height - 64
            Width: =Parent.Width
            Height: =64
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - btnSubmit_Delete:
          Control: Classic/Button
          Properties:
            Text: ="Delete…"
            OnSelect: |-
              =If(Len(Trim(txtJust_Delete.Text)) < 10,
                  Notify("Business justification is required (10+ characters).", NotificationType.Warning),
                  Reset(txtConfirm_Delete); Set(varDelConfirm, true)
              )
            X: =360
            Y: =Parent.Height - 50
            Width: =170
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =gTheme.Primary
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =gTheme.PrimaryHover
            PressedFill: =gTheme.PrimaryHover
            BorderThickness: =0
            HoverColor: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(IsBlank(varDelApp), DisplayMode.Disabled, DisplayMode.Edit)
      - btnCancel_Delete:
          Control: Classic/Button
          Properties:
            Text: ="Cancel"
            OnSelect: =Set(varDelApp, Blank()); Navigate(scrHome, ScreenTransition.Fade)
            X: =540
            Y: =Parent.Height - 50
            Width: =120
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =RGBA(0, 0, 0, 0)
            Color: =gTheme.Text
            HoverFill: =gTheme.Bg
            PressedFill: =gTheme.Bg
            BorderColor: =gTheme.Border
            BorderThickness: =1
            HoverColor: =gTheme.Text
            HoverBorderColor: =gTheme.Muted
      - recShade_Delete:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.45)
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =1
            Visible: =varDelConfirm
      - recConfirm_Delete:
          Control: Rectangle
          Properties:
            X: =(Parent.Width - 620) / 2
            Y: =190
            Width: =620
            Height: =320
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
            Visible: =varDelConfirm
      - lblConfirmHead_Delete:
          Control: Label
          Properties:
            Text: ="Delete " & varDelApp.Title & "?"
            X: =(Parent.Width - 620) / 2 + 28
            Y: =210
            Width: =564
            Height: =34
            Size: =16
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
            Visible: =varDelConfirm
      - lblConfirmText_Delete:
          Control: Label
          Properties:
            Text: |-
              ="You asked to: " & radDelAction_Delete.Selected.Value & ". Your manager and the Entra ID team approve first; nothing changes until then."
            X: =(Parent.Width - 620) / 2 + 28
            Y: =252
            Width: =564
            Height: =70
            Size: =11
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =true
            Visible: =varDelConfirm
      - txtConfirm_Delete:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="Type DELETE to confirm a permanent delete"
            X: =(Parent.Width - 620) / 2 + 28
            Y: =334
            Width: =300
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
            HoverBorderColor: =gTheme.Primary
            FocusedBorderColor: =gTheme.Primary
            FocusedBorderThickness: =2
            PaddingLeft: =10
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Visible: |-
              =varDelConfirm && radDelAction_Delete.Selected.Value = "Delete permanently: no restore"
      - btnConfirmYes_Delete:
          Control: Classic/Button
          Properties:
            Text: ="Yes, submit for approval"
            OnSelect: |-
              =Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
              IfError(
                  Patch(EntraRequests, Defaults(EntraRequests), {
                      Title: varReqId,
                      RequestType: {Value: "deleteAppRegistration"},
                      Status: {Value: "Submitted"},
                      AppCatId: varDelApp.AppCatId,
                      TargetDisplayName: varDelApp.Title,
                      TargetObjectId: varDelApp.ObjectId,
                      Justification: Trim(txtJust_Delete.Text),
                      TicketReference: Trim(txtTicket_Delete.Text),
                      PayloadJson: JSON({applicationObjectId: varDelApp.ObjectId, appId: varDelApp.AppId, displayName: varDelApp.Title,
                          action: Switch(radDelAction_Delete.Selected.Value, "Delete the app registration and its enterprise app (can be restored for 30 days)", "soft", "Delete permanently: no restore", "permanent", "Disable sign-in only: keep everything, nobody can sign in", "disable", "spOnly"), actionLabel: radDelAction_Delete.Selected.Value}, JSONFormat.Compact)
                  }),
                  Notify("The request could not be submitted: " & FirstError.Message, NotificationType.Error),
                  Set(varDelConfirm, false); Set(varDelApp, Blank()); Reset(txtAppId_Delete); Reset(txtJust_Delete); Reset(txtTicket_Delete); Reset(txtConfirm_Delete);
                  Notify("Request " & varReqId & " submitted. Your manager and the Entra ID team approve it before anything is deleted.", NotificationType.Success);
                  Set(varSelectedReqId, Blank()); Navigate(scrMyRequests, ScreenTransition.Fade)
              )
            X: =(Parent.Width - 620) / 2 + 28
            Y: =442
            Width: =240
            Height: =40
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =gTheme.Primary
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =gTheme.PrimaryHover
            PressedFill: =gTheme.PrimaryHover
            BorderThickness: =0
            HoverColor: =RGBA(255, 255, 255, 1)
            DisplayMode: |-
              =If(radDelAction_Delete.Selected.Value = "Delete permanently: no restore" && Trim(txtConfirm_Delete.Text) <> "DELETE", DisplayMode.Disabled, DisplayMode.Edit)
            Visible: =varDelConfirm
      - btnConfirmNo_Delete:
          Control: Classic/Button
          Properties:
            Text: ="Cancel"
            OnSelect: =Set(varDelConfirm, false)
            X: =(Parent.Width - 620) / 2 + 280
            Y: =442
            Width: =120
            Height: =40
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =RGBA(0, 0, 0, 0)
            Color: =gTheme.Text
            HoverFill: =gTheme.Bg
            PressedFill: =gTheme.Bg
            BorderColor: =gTheme.Border
            BorderThickness: =1
            HoverColor: =gTheme.Text
            HoverBorderColor: =gTheme.Muted
            Visible: =varDelConfirm
