# Delete or disable an app registration you own (request type deleteAppRegistration: ER-01 approvals, then ER-02)
# Paste into screen scrDeleteApp: copy all, select the screen in the Tree view, Ctrl+V.
- cntRoot_Delete:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =gTheme.Bg
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - recTopBar_Delete:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =48
            Fill: =gTheme.TopBar
            BorderColor: =gTheme.Border
            BorderThickness: =0
      - lblBrand_Delete:
          Control: Label
          Properties:
            Text: ="Entra Self-Service"
            X: =20
            Y: =0
            Width: =300
            Height: =48
            Size: =13
            Font: =Font.'Segoe UI'
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
            OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
      - lblUser_Delete:
          Control: Label
          Properties:
            Text: =gMe.Name
            X: =Parent.Width - 340
            Y: =0
            Width: =320
            Height: =48
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            Align: =Align.Right
      - lblCrumb_Delete:
          Control: Label
          Properties:
            Text: ="Home  ›  App registrations  ›  Delete"
            X: =24
            Y: =58
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            Font: =Font.'Segoe UI'
            Color: =gTheme.Primary
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
      - lblTitle_Delete:
          Control: Label
          Properties:
            Text: ="Delete app registration"
            X: =24
            Y: =80
            Width: =Parent.Width - 48
            Height: =34
            Size: =18
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
      - lblSubtitle_Delete:
          Control: Label
          Properties:
            Text: ="Delete or disable an app registration you own. Manager and Entra ID team approve first."
            X: =24
            Y: =112
            Width: =Parent.Width - 48
            Height: =22
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =gTheme.Muted
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
      - recApps_Delete:
          Control: Rectangle
          Properties:
            X: =24
            Y: =146
            Width: =320
            Height: =Parent.Height - 146 - 80
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - lblAppsHead_Delete:
          Control: Label
          Properties:
            Text: ="Find the app registration"
            X: =40
            Y: =156
            Width: =288
            Height: =26
            Size: =12
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
      - lblAppId_Delete:
          Control: Label
          Properties:
            Text: ="Object ID or Application (client) ID *"
            X: =40
            Y: =190
            Width: =288
            Height: =20
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
      - txtAppId_Delete:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="00000000-0000-0000-0000-000000000000"
            X: =40
            Y: =212
            Width: =288
            Height: =34
            Size: =11
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
            HoverBorderColor: =gTheme.Primary
            FocusedBorderColor: =gTheme.Primary
            FocusedBorderThickness: =2
            PaddingLeft: =10
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            DisplayMode: =If(varDelBusy, DisplayMode.Disabled, DisplayMode.Edit)
      - btnFind_Delete:
          Control: Classic/Button
          Properties:
            Text: ="Search"
            OnSelect: |-
              =If(
                  !IsMatch(Lower(Trim(txtAppId_Delete.Text)), "^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$"),
                      Notify("Enter the app registration's Object ID or Application (client) ID (a GUID).", NotificationType.Warning),
                  varDelBusy,
                      Notify("Still searching, one moment.", NotificationType.Information),
                  Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
                  Set(varDelApp, Blank()); Set(varDelMsg, ""); Set(varDelConfirm, false);
                  IfError(
                      Set(varDelRec, Patch(EntraRequests, Defaults(EntraRequests), {
                          Title: varReqId, RequestType: {Value: "lookupApp"}, Status: {Value: "Submitted"},
                          TargetDisplayName: Lower(Trim(txtAppId_Delete.Text)), TargetObjectId: Lower(Trim(txtAppId_Delete.Text)), Justification: "Find an app registration to delete"
                      })),
                      Notify("The search could not start: " & FirstError.Message, NotificationType.Error),
                      Set(varDelPolls, 0); Set(varDelBusy, true)
                  )
              )
            X: =40
            Y: =256
            Width: =120
            Height: =34
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =gTheme.Primary
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =gTheme.PrimaryHover
            PressedFill: =gTheme.PrimaryHover
            BorderThickness: =0
            HoverColor: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varDelBusy, DisplayMode.Disabled, DisplayMode.Edit)
      - lblLookupBusy_Delete:
          Control: Label
          Properties:
            Text: ="Searching Entra…"
            X: =170
            Y: =256
            Width: =158
            Height: =34
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =gTheme.Primary
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
            Visible: =varDelBusy
      - lblLookupMsg_Delete:
          Control: Label
          Properties:
            Text: =varDelMsg
            X: =40
            Y: =300
            Width: =288
            Height: =96
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =gTheme.Danger
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top
            Visible: =!IsBlank(varDelMsg)
      - lblLookupInfo_Delete:
          Control: Label
          Properties:
            Text: |-
              ="Only the app's owner can delete it: the user in its team:user\\… tag, or a member of the group in its team:group\\… tag."
            X: =40
            Y: =404
            Width: =288
            Height: =80
            Size: =9
            Font: =Font.'Segoe UI'
            Color: =gTheme.Muted
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top
      - tmrLookup_Delete:
          Control: Timer
          Properties:
            Duration: =3000
            Repeat: =true
            AutoStart: =false
            Start: =varDelBusy
            OnTimerEnd: |-
              =Set(varDelPolls, varDelPolls + 1);
              Refresh(EntraRequests);
              With({r: LookUp(EntraRequests, ID = varDelRec.ID)},
                  If(
                      r.Status.Value = "Completed",
                          With({j: ParseJSON(r.ResultJson)},
                              Set(varDelApp, {Title: Text(j.displayName), ObjectId: Text(j.objectId), AppId: Text(j.appId), AppCatId: Text(j.appCatId),
                                  Team: Text(j.team), TeamName: Text(j.teamName), ServicePrincipalId: Text(j.servicePrincipalId)})
                          );
                          Set(varDelBusy, false),
                      r.Status.Value = "Failed",
                          Set(varDelBusy, false);
                          Set(varDelMsg, Coalesce(r.ErrorMessage, "Not found, or you are not an authorized owner of this app registration."));
                          Notify(varDelMsg, NotificationType.Error),
                      varDelPolls >= 40,
                          Set(varDelBusy, false); Set(varDelMsg, "No answer yet. Search again in a minute.")
                  )
              )
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - recDetail_Delete:
          Control: Rectangle
          Properties:
            X: =360
            Y: =146
            Width: =Parent.Width - 384
            Height: =Parent.Height - 146 - 80
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - lblPick_Delete:
          Control: Label
          Properties:
            Text: ="Search for the app registration on the left."
            X: =376
            Y: =170
            Width: =500
            Height: =30
            Size: =11
            Font: =Font.'Segoe UI'
            Color: =gTheme.Muted
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            Visible: =IsBlank(varDelApp)
      - cntDetail_Delete:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =376
            Y: =160
            Width: =Parent.Width - 416
            Height: =Parent.Height - 160 - 92
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Visible: =!IsBlank(varDelApp)
          Children:
            - lblAppTitle_Delete:
                Control: Label
                Properties:
                  Text: =varDelApp.Title
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =30
                  Size: =15
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - lblAppInfo_Delete:
                Control: Label
                Properties:
                  Text: ="Object ID " & varDelApp.ObjectId & "    ·    App ID " & varDelApp.AppId
                  X: =0
                  Y: =32
                  Width: =Parent.Width
                  Height: =20
                  Size: =9
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
            - lblAppInfo2_Delete:
                Control: Label
                Properties:
                  Text: |-
                    ="Owner tag " & varDelApp.Team & If(IsBlank(varDelApp.TeamName), "", " (" & varDelApp.TeamName & ")") & "    ·    Enterprise app: " & If(IsBlank(varDelApp.ServicePrincipalId), "none", "yes")
                  X: =0
                  Y: =54
                  Width: =Parent.Width
                  Height: =20
                  Size: =9
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
            - lblAction_Delete:
                Control: Label
                Properties:
                  Text: ="What should happen? *"
                  X: =0
                  Y: =92
                  Width: =400
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - radDelAction_Delete:
                Control: Classic/Radio
                Properties:
                  Items: |-
                    =["Delete the app registration and its enterprise app (can be restored for 30 days)", "Delete permanently: no restore", "Disable sign-in only: keep everything, nobody can sign in", "Delete only the enterprise application: keep the app registration"]
                  Default: ="Delete the app registration and its enterprise app (can be restored for 30 days)"
                  X: =0
                  Y: =116
                  Width: =Parent.Width
                  Height: =150
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  RadioSize: =18
                  RadioSelectionFill: =gTheme.Primary
                  RadioBorderColor: =gTheme.Muted
                  Layout: =Layout.Vertical
            - lblActionNote_Delete:
                Control: Label
                Properties:
                  Text: |-
                    =Switch(radDelAction_Delete.Selected.Value, "Delete the app registration and its enterprise app (can be restored for 30 days)", "Deleting an app registration always deletes its enterprise app and role assignments in this tenant. The Entra ID team can restore both from Deleted applications for 30 days.", "Delete permanently: no restore", "Gone for good: the app registration, its enterprise app and role assignments can not be restored. Anything still using its client ID or certificate stops working.", "Disable sign-in only: keep everything, nobody can sign in", "Safest choice: sets the enterprise app to not allow sign-in. Undo any time in Entra (Enterprise applications > Properties).", "Removes the enterprise app and its role assignments; the app registration stays. Create the enterprise app again with the Enterprise application card.")
                  X: =0
                  Y: =272
                  Width: =Parent.Width
                  Height: =48
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: |-
                    =If(radDelAction_Delete.Selected.Value = "Delete permanently: no restore", gTheme.Danger, gTheme.Muted)
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =true
            - lblJust_Delete:
                Control: Label
                Properties:
                  Text: ="Business justification *"
                  X: =0
                  Y: =Parent.Height - 140
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtJust_Delete:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  HintText: ="Why should it be deleted or disabled?"
                  X: =0
                  Y: =Parent.Height - 118
                  Width: =(Parent.Width - 24) / 2
                  Height: =72
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  HoverBorderColor: =gTheme.Primary
                  FocusedBorderColor: =gTheme.Primary
                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  Mode: =TextMode.MultiLine
            - lblTicket_Delete:
                Control: Label
                Properties:
                  Text: ="Change ticket"
                  X: =(Parent.Width + 24) / 2
                  Y: =Parent.Height - 140
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtTicket_Delete:
                Control: Classic/TextInput
                Properties:
                  Default: =""
