# New security group: standalone request, or inline group for the wizard / change screen
# Paste into screen scrNewGroup: copy all, select the screen in the Tree view, Ctrl+V.
- cntRoot_Group:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =gTheme.Bg
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - recTopBar_Group:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =48
            Fill: =gTheme.TopBar
            BorderColor: =gTheme.Border
            BorderThickness: =0
      - lblBrand_Group:
          Control: Label
          Properties:
            Text: ="Entra Self-Service"
            X: =20
            Y: =0
            Width: =300
            Height: =48
            Size: =13
            Font: =Font.'Segoe UI'
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
            OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
      - lblUser_Group:
          Control: Label
          Properties:
            Text: =gMe.Name
            X: =Parent.Width - 340
            Y: =0
            Width: =320
            Height: =48
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            Align: =Align.Right
      - lblCrumb_Group:
          Control: Label
          Properties:
            Text: =If(varGroupMode = "standalone", "Home  ›  Groups  ›  New security group", "Home  ›  Register an application  ›  New group")
            X: =24
            Y: =58
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            Font: =Font.'Segoe UI'
            Color: =gTheme.Primary
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
      - lblTitle_Group:
          Control: Label
          Properties:
            Text: =If(varGroupMode = "standalone", "New security group", "New group for this request")
            X: =24
            Y: =80
            Width: =Parent.Width - 48
            Height: =34
            Size: =18
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
      - lblSubtitle_Group:
          Control: Label
          Properties:
            Text: =If(varGroupMode = "standalone", "Raise a request for a security group you own.", "The group is created when the request is approved, and is owned by you.")
            X: =24
            Y: =112
            Width: =Parent.Width - 48
            Height: =22
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =gTheme.Muted
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
      - recCard_Group:
          Control: Rectangle
          Properties:
            X: =24
            Y: =146
            Width: =Parent.Width - 48
            Height: =Parent.Height - 146 - 80
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - cntGroup_Group:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =48
            Y: =170
            Width: =Parent.Width - 96
            Height: =Parent.Height - 170 - 92
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
          Children:
            - lblGName_Group:
                Control: Label
                Properties:
                  Text: ="Group name *"
                  X: =0
                  Y: =0
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtGroupName_Group:
                Control: Classic/TextInput
                Properties:
                  Default: =varGroupSuggest
                  HintText: ="grp-orders-admins"
                  X: =0
                  Y: =22
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  HoverBorderColor: =gTheme.Primary
                  FocusedBorderColor: =gTheme.Primary
                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
            - hntGName_Group:
                Control: Label
                Properties:
                  Text: ="Security group. A unique mail nickname is generated automatically."
                  X: =0
                  Y: =60
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =9
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
            - lblGAppCat_Group:
                Control: Label
                Properties:
                  Text: ="appCatID *"
                  X: =(Parent.Width + 24) / 2
                  Y: =0
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtGroupAppCat_Group:
                Control: Classic/TextInput
                Properties:
                  Default: =Coalesce(First(Filter(gMyGroups, !IsBlank(AppCatId))).AppCatId, "")
                  HintText: ="APPCAT-001"
                  X: =(Parent.Width + 24) / 2
                  Y: =22
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  HoverBorderColor: =gTheme.Primary
                  FocusedBorderColor: =gTheme.Primary
                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  Visible: =varGroupMode = "standalone"
            - hntGAppCat_Group:
                Control: Label
                Properties:
                  Text: ="Inline groups use the appCatID of the request they belong to."
                  X: =(Parent.Width + 24) / 2
                  Y: =22
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =9
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Visible: =!(varGroupMode = "standalone")
            - lblGDesc_Group:
                Control: Label
                Properties:
                  Text: ="Description"
                  X: =0
                  Y: =96
                  Width: =Parent.Width
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtGroupDesc_Group:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  HintText: ="What membership of this group grants"
                  X: =0
                  Y: =118
                  Width: =Parent.Width
                  Height: =64
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  HoverBorderColor: =gTheme.Primary
                  FocusedBorderColor: =gTheme.Primary
                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  Mode: =TextMode.MultiLine
            - lblGOwners_Group:
                Control: Label
                Properties:
                  Text: ="Additional owners"
                  X: =0
                  Y: =196
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - cmbGroupOwners_Group:
                Control: Classic/ComboBox
                Properties:
                  Items: |-
                    =Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 15, isSearchTermRequired: false}).value
                  DisplayFields: =["DisplayName", "Mail"]
                  SearchFields: =["DisplayName"]
                  SelectMultiple: =true
                  IsSearchable: =true
                  InputTextPlaceholder: ="Search people"
                  X: =0
                  Y: =218
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  ChevronBackground: =gTheme.Card
                  ChevronFill: =gTheme.Muted
                  SelectionFill: =gTheme.Primary
                  HoverFill: =gTheme.PrimaryLight
            - lblGMembers_Group:
                Control: Label
                Properties:
                  Text: ="Initial members"
                  X: =(Parent.Width + 24) / 2
                  Y: =196
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - cmbGroupMembers_Group:
                Control: Classic/ComboBox
                Properties:
                  Items: |-
                    =Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 15, isSearchTermRequired: false}).value
                  DisplayFields: =["DisplayName", "Mail"]
                  SearchFields: =["DisplayName"]
                  SelectMultiple: =true
                  IsSearchable: =true
                  InputTextPlaceholder: ="Search people"
                  X: =(Parent.Width + 24) / 2
                  Y: =218
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  ChevronBackground: =gTheme.Card
                  ChevronFill: =gTheme.Muted
                  SelectionFill: =gTheme.Primary
                  HoverFill: =gTheme.PrimaryLight
                  DisplayMode: =If(varGroupMode = "standalone", DisplayMode.Edit, DisplayMode.Disabled)
            - lblGJust_Group:
                Control: Label
                Properties:
                  Text: ="Business justification *"
                  X: =0
                  Y: =270
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtGroupJust_Group:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  HintText: ="Why is this group needed?"
                  X: =0
                  Y: =292
                  Width: =(Parent.Width - 24) / 2
                  Height: =64
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  HoverBorderColor: =gTheme.Primary
                  FocusedBorderColor: =gTheme.Primary
                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  Mode: =TextMode.MultiLine
                  Visible: =varGroupMode = "standalone"
            - hntGJust_Group:
                Control: Label
                Properties:
                  Text: ="Inline groups are justified by the request they belong to."
                  X: =0
                  Y: =292
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =9
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Visible: =!(varGroupMode = "standalone")
            - recGInfo_Group:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =376
                  Width: =Parent.Width
                  Height: =64
                  Fill: =gTheme.PrimaryLight
                  BorderColor: =gTheme.PrimaryLight
                  BorderThickness: =1
            - lblGInfo_Group:
                Control: Label
                Properties:
                  Text: ="You will be an owner of this group. Owners add and remove members themselves in My Groups or the Entra admin center — that is how access to app roles is managed day to day, without new requests."
                  X: =16
                  Y: =382
                  Width: =Parent.Width - 32
                  Height: =52
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =true
                  VerticalAlign: =VerticalAlign.Middle
      - recCmd_Group:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.Height - 64
            Width: =Parent.Width
            Height: =64
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - btnGroupPrimary_Group:
          Control: Classic/Button
          Properties:
            Text: =If(varGroupMode = "standalone", "Submit request", "Add to request")
            OnSelect: |-
              =With({err: Coalesce(
                      If(!IsMatch(Trim(txtGroupName_Group.Text), "^[A-Za-z0-9][A-Za-z0-9 ._-]{2,119}$"), "Group name: 3-120 letters, digits, spaces, . _ or -"),
                      If(varGroupMode = "standalone" && !IsMatch(Upper(Trim(txtGroupAppCat_Group.Text)), gAppCatPattern), "appCatID looks like APPCAT-001."),
                      If(varGroupMode = "standalone" && Len(Trim(txtGroupJust_Group.Text)) < 10, "Business justification is required (10+ characters).")
                  )},
                  If(!IsBlank(err),
                      Notify(err, NotificationType.Warning),
                      With({g: {Mode: "new", GroupId: "", DisplayName: Trim(txtGroupName_Group.Text), Description: Substitute(Substitute(Substitute(Substitute(Trim(txtGroupDesc_Group.Text), Char(13), ""), Char(10), " "), """", "'"), "\", "/"), OwnerIds: Concat(cmbGroupOwners_Group.SelectedItems, Id, ";")}},
                          Switch(varGroupMode,
                              "inline-team", Set(varNewTeam, g); Back(),
                              "inline-role", Collect(colRoleGroups, {RoleKey: varGroupForRole, Mode: "new", GroupId: "", DisplayName: g.DisplayName, Description: g.Description, OwnerIds: g.OwnerIds}); Back(),
                              "inline-assign", Collect(colAssign, {RoleId: varAssignRole.Id, RoleValue: varAssignRole.Value, Mode: "new", GroupId: "", DisplayName: g.DisplayName, Description: g.Description, OwnerIds: g.OwnerIds}); Back(),
                              Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
                              IfError(
                                  Patch(EntraRequests, Defaults(EntraRequests), {
                                      Title: varReqId,
                                      RequestType: {Value: "createGroup"},
                                      Status: {Value: "Submitted"},
                                      AppCatId: Upper(Trim(txtGroupAppCat_Group.Text)),
                                      TargetDisplayName: Trim(txtGroupName_Group.Text),
                                      Justification: Trim(txtGroupJust_Group.Text),
                                      PayloadJson: JSON({
                                          displayName: Trim(txtGroupName_Group.Text),
                                          description: Substitute(Substitute(Substitute(Substitute(Trim(txtGroupDesc_Group.Text), Char(13), ""), Char(10), " "), """", "'"), "\", "/"),
                                          ownerIds: Concat(cmbGroupOwners_Group.SelectedItems, Id, ";"),
                                          memberIds: Concat(cmbGroupMembers_Group.SelectedItems, Id, ";")
                                      }, JSONFormat.Compact)
                                  }),
                                  Notify("The request could not be submitted: " & FirstError.Message, NotificationType.Error),
                                  Notify("Request " & varReqId & " submitted for approval.", NotificationType.Success); Set(varSelectedReqId, Blank()); Navigate(scrMyRequests, ScreenTransition.Fade)
                              )
                          )
                      )
                  )
              )
            X: =24
            Y: =Parent.Height - 50
            Width: =170
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =gTheme.Primary
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =gTheme.PrimaryHover
            PressedFill: =gTheme.PrimaryHover
            BorderThickness: =0
            HoverColor: =RGBA(255, 255, 255, 1)
      - btnGroupCancel_Group:
          Control: Classic/Button
          Properties:
            Text: ="Cancel"
            OnSelect: =Back()
            X: =204
            Y: =Parent.Height - 50
            Width: =120
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =RGBA(0, 0, 0, 0)
            Color: =gTheme.Text
            HoverFill: =gTheme.Bg
            PressedFill: =gTheme.Bg
            BorderColor: =gTheme.Border
            BorderThickness: =1
            HoverColor: =gTheme.Text
            HoverBorderColor: =gTheme.Muted
