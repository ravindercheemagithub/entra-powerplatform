            Items: =gSteps
            X: =24
            Y: =156
            Width: =256
            Height: =340
            TemplateSize: =64
            TemplatePadding: =0
            WrapCount: =1
            ShowScrollbar: =true
            BorderThickness: =0
            OnSelect: =If(ThisItem.Step <= varMaxStep, Set(varStep, ThisItem.Step))
