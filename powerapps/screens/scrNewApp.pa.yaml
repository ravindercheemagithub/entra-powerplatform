            - recStepSel_NewApp:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =8
                  Width: =4
                  Height: =48
                  Fill: =If(ThisItem.Step = varStep, gTheme.Primary, RGBA(0, 0, 0, 0))
