# Add an existing group to the catalog (request type onboardGroup, processed by flow ER-04)
# Paste into screen scrAddGroup: copy all, select the screen in the Tree view, Ctrl+V.
- cntRoot_AddGroup:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =gTheme.Bg
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - recTopBar_AddGroup:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =48
            Fill: =gTheme.TopBar
            BorderColor: =gTheme.Border
            BorderThickness: =0
      - lblBrand_AddGroup:
          Control: Label
          Properties:
            Text: ="Entra Self-Service"
            X: =20
            Y: =0
            Width: =300
            Height: =48
            Size: =13
            Font: =Font.'Segoe UI'
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
            OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
      - lblUser_AddGroup:
          Control: Label
          Properties:
            Text: =gMe.Name
            X: =Parent.Width - 340
            Y: =0
            Width: =320
            Height: =48
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            Align: =Align.Right
      - lblCrumb_AddGroup:
          Control: Label
          Properties:
            Text: ="Home  ›  Groups  ›  Add existing group"
            X: =24
            Y: =58
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            Font: =Font.'Segoe UI'
            Color: =gTheme.Primary
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
            OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
      - lblTitle_AddGroup:
          Control: Label
          Properties:
            Text: ="Add an existing group"
            X: =24
            Y: =80
            Width: =Parent.Width - 48
            Height: =34
            Size: =18
            Font: =Font.'Segoe UI'
            Color: =gTheme.Text
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =0
            PaddingRight: =0
      - lblSubtitle_AddGroup:
          Control: Label
          Properties:
            Text: ="Make a group you belong to selectable as an owning team or role group."
            X: =24
            Y: =112
            Width: =Parent.Width - 48
            Height: =22
            Size: =10
            Font: =Font.'Segoe UI'
            Color: =gTheme.Muted
            FontWeight: =FontWeight.Normal
            PaddingLeft: =0
            PaddingRight: =0
      - recCard_AddGroup:
          Control: Rectangle
          Properties:
            X: =24
            Y: =146
            Width: =Parent.Width - 48
            Height: =Parent.Height - 146 - 80
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - cntAddGroup_AddGroup:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =48
            Y: =170
            Width: =Parent.Width - 96
            Height: =Parent.Height - 170 - 92
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
          Children:
            - lblGroup_AddGroup:
                Control: Label
                Properties:
                  Text: ="Group name or Object ID *"
                  X: =0
                  Y: =0
                  Width: =(Parent.Width - 24) / 2
                  Height: =20
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - txtGroup_AddGroup:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  HintText: ="grp-orders-admins   or   00000000-0000-0000-0000-000000000000"
                  X: =0
                  Y: =22
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  Fill: =gTheme.Card
                  BorderColor: =gTheme.Border
                  BorderThickness: =1
                  HoverBorderColor: =gTheme.Primary
                  FocusedBorderColor: =gTheme.Primary
                  FocusedBorderThickness: =2
                  PaddingLeft: =10
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  DisplayMode: =If(varOnboardBusy, DisplayMode.Disabled, DisplayMode.Edit)
            - hntGroup_AddGroup:
                Control: Label
                Properties:
                  Text: ="The group's exact display name, or its Object ID (Entra admin center → Groups → the group). Use the Object ID if several groups share the name."
                  X: =0
                  Y: =60
                  Width: =(Parent.Width - 24) / 2
                  Height: =36
                  Size: =9
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =true
            - lblChecking_AddGroup:
                Control: Label
                Properties:
                  Text: ="Checking the group in Entra…"
                  X: =0
                  Y: =104
                  Width: =(Parent.Width - 24) / 2
                  Height: =28
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Primary
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
                  Visible: =varOnboardBusy
            - recInfo_AddGroup:
                Control: Rectangle
                Properties:
                  X: =(Parent.Width + 24) / 2
                  Y: =0
                  Width: =(Parent.Width - 24) / 2
                  Height: =132
                  Fill: =gTheme.PrimaryLight
                  BorderColor: =gTheme.PrimaryLight
                  BorderThickness: =1
            - lblInfo_AddGroup:
                Control: Label
                Properties:
                  Text: ="Groups are created outside this app. Here you make an existing group selectable for your app registrations and role assignments. A flow looks the group up in Entra and checks that you are a member or owner of it and that it is a security group. No approval is needed and nothing changes in Entra. The result shows here within a few seconds."
                  X: =(Parent.Width + 24) / 2 + 14
                  Y: =8
                  Width: =(Parent.Width - 24) / 2 - 28
                  Height: =116
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =true
                  VerticalAlign: =VerticalAlign.Top
            - lblHistory_AddGroup:
                Control: Label
                Properties:
                  Text: ="Your recent additions"
                  X: =0
                  Y: =264
                  Width: =(Parent.Width - 24) / 2
                  Height: =28
                  Size: =12
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Text
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
            - lnkRefresh_AddGroup:
                Control: Label
                Properties:
                  Text: ="↻ Refresh"
                  X: =Parent.Width - 120
                  Y: =266
                  Width: =120
                  Height: =24
                  Size: =11
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Primary
                  FontWeight: =FontWeight.Semibold
                  PaddingLeft: =0
                  PaddingRight: =0
                  OnSelect: =Refresh(EntraRequests); Refresh(EntraCatalogGroups)
            - galOnboard_AddGroup:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: =FirstN(Sort(Filter(EntraRequests, RequestType.Value = "onboardGroup"), ID, SortOrder.Descending), 6)
                  X: =0
                  Y: =300
                  Width: =Parent.Width
                  Height: =Parent.Height - 300
                  TemplateSize: =64
                  TemplatePadding: =0
                  WrapCount: =1
                  ShowScrollbar: =true
                  BorderThickness: =0
                Children:
                  - lblOName_AddGroup:
                      Control: Label
                      Properties:
                        Text: =ThisItem.TargetDisplayName
                        X: =12
                        Y: =6
                        Width: =Parent.TemplateWidth - 190
                        Height: =22
                        Size: =11
                        Font: =Font.'Segoe UI'
                        Color: =gTheme.Text
                        FontWeight: =FontWeight.Semibold
                        PaddingLeft: =0
                        PaddingRight: =0
                  - lblOMeta_AddGroup:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Title & "  ·  " & Text(ThisItem.Created, "dd mmm yyyy hh:mm")
                        X: =12
                        Y: =28
                        Width: =Parent.TemplateWidth - 190
                        Height: =18
                        Size: =9
                        Font: =Font.'Segoe UI'
                        Color: =gTheme.Muted
                        FontWeight: =FontWeight.Normal
                        PaddingLeft: =0
                        PaddingRight: =0
                  - lblOError_AddGroup:
                      Control: Label
                      Properties:
                        Text: =ThisItem.ErrorMessage
                        X: =12
                        Y: =44
                        Width: =Parent.TemplateWidth - 24
                        Height: =18
                        Size: =9
                        Font: =Font.'Segoe UI'
                        Color: =gTheme.Danger
                        FontWeight: =FontWeight.Normal
                        PaddingLeft: =0
                        PaddingRight: =0
                        Visible: =!IsBlank(ThisItem.ErrorMessage)
                  - lblOStatus_AddGroup:
                      Control: Label
                      Properties:
                        Text: =Switch(ThisItem.Status.Value, "PendingManagerApproval", "Awaiting manager", "PendingEntraApproval", "Awaiting Entra team", "InProgress", "In progress", ThisItem.Status.Value)
                        X: =Parent.TemplateWidth - 166
                        Y: =8
                        Width: =150
                        Height: =22
                        Size: =9
                        Font: =Font.'Segoe UI'
                        Color: =Switch(ThisItem.Status.Value, "Completed", gTheme.Success, "Failed", gTheme.Danger, "Rejected", gTheme.Danger, "InProgress", gTheme.Primary, "Approved", gTheme.Primary, gTheme.Warning)
                        FontWeight: =FontWeight.Semibold
                        PaddingLeft: =6
                        PaddingRight: =6
                        Fill: =Switch(ThisItem.Status.Value, "Completed", gTheme.SuccessLight, "Failed", gTheme.DangerLight, "Rejected", gTheme.DangerLight, "InProgress", gTheme.PrimaryLight, "Approved", gTheme.PrimaryLight, gTheme.WarningLight)
                        Align: =Align.Center
                  - recOSep_AddGroup:
                      Control: Rectangle
                      Properties:
                        X: =12
                        Y: =Parent.TemplateHeight - 1
                        Width: =Parent.TemplateWidth - 24
                        Height: =1
                        Fill: =gTheme.Border
                        BorderColor: =gTheme.Border
                        BorderThickness: =0
            - lblHistoryEmpty_AddGroup:
                Control: Label
                Properties:
                  Text: ="Nothing added yet."
                  X: =0
                  Y: =304
                  Width: =(Parent.Width - 24) / 2
                  Height: =24
                  Size: =10
                  Font: =Font.'Segoe UI'
                  Color: =gTheme.Muted
                  FontWeight: =FontWeight.Normal
                  PaddingLeft: =0
                  PaddingRight: =0
                  Visible: =CountRows(galOnboard_AddGroup.AllItems) = 0
      - recCmd_AddGroup:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.Height - 64
            Width: =Parent.Width
            Height: =64
            Fill: =gTheme.Card
            BorderColor: =gTheme.Border
            BorderThickness: =1
      - btnSubmit_AddGroup:
          Control: Classic/Button
          Properties:
            Text: ="Add group"
            OnSelect: |-
              =If(
                  Len(Trim(txtGroup_AddGroup.Text)) < 2,
                      Notify("Enter the group's exact name or its Object ID.", NotificationType.Warning),
                  varOnboardBusy,
                      Notify("Still checking the previous group, one moment.", NotificationType.Information),
                  !IsBlank(LookUp(gMyGroups, GroupId = Lower(Trim(txtGroup_AddGroup.Text)) || Lower(Title) = Lower(Trim(txtGroup_AddGroup.Text)))),
                      Notify("This group is already available to you in the pickers.", NotificationType.Information),
                  Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
                  IfError(
                      Set(varOnboardRec, Patch(EntraRequests, Defaults(EntraRequests), {
                          Title: varReqId,
                          RequestType: {Value: "onboardGroup"},
                          Status: {Value: "Submitted"},
                          TargetDisplayName: Trim(txtGroup_AddGroup.Text),
                          TargetObjectId: If(IsMatch(Lower(Trim(txtGroup_AddGroup.Text)), "^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$"), Lower(Trim(txtGroup_AddGroup.Text)), ""),
                          Justification: "Add an existing group to the self-service catalog",
                          PayloadJson: JSON({group: Trim(txtGroup_AddGroup.Text)}, JSONFormat.Compact)
                      })),
                      Notify("The request could not be submitted: " & FirstError.Message, NotificationType.Error),
                      Set(varOnboardPolls, 0); Set(varOnboardBusy, true)
                  )
              )
            X: =24
            Y: =Parent.Height - 50
            Width: =170
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =gTheme.Primary
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =gTheme.PrimaryHover
            PressedFill: =gTheme.PrimaryHover
            BorderThickness: =0
            HoverColor: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varOnboardBusy, DisplayMode.Disabled, DisplayMode.Edit)
      - btnBack_AddGroup:
          Control: Classic/Button
          Properties:
            Text: ="Back"
            OnSelect: =Back()
            X: =204
            Y: =Parent.Height - 50
            Width: =120
            Height: =36
            Size: =11
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Fill: =RGBA(0, 0, 0, 0)
            Color: =gTheme.Text
            HoverFill: =gTheme.Bg
            PressedFill: =gTheme.Bg
            BorderColor: =gTheme.Border
            BorderThickness: =1
            HoverColor: =gTheme.Text
            HoverBorderColor: =gTheme.Muted
      - tmrOnboard_AddGroup:
          Control: Timer
          Properties:
            Duration: =3000
            Repeat: =true
            AutoStart: =false
            Start: =varOnboardBusy
            OnTimerEnd: |-
              =Set(varOnboardPolls, varOnboardPolls + 1);
              Refresh(EntraRequests);
              With({r: LookUp(EntraRequests, ID = varOnboardRec.ID)},
                  If(
                      r.Status.Value = "Completed",
                          Set(varOnboardBusy, false); Refresh(EntraCatalogGroups); Reset(txtGroup_AddGroup);
                          Notify("Added: " & r.TargetDisplayName & ". It is now available in the Owning team and role-group pickers.", NotificationType.Success),
                      r.Status.Value = "Failed",
                          Set(varOnboardBusy, false);
                          Notify("Not added: " & Coalesce(r.ErrorMessage, "the group was not found, or you are not a member or owner of it."), NotificationType.Error),
                      varOnboardPolls >= 20,
                          Set(varOnboardBusy, false);
                          Notify("Still checking. The result will appear in the list below when the check finishes.", NotificationType.Information)
                  )
              )
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
