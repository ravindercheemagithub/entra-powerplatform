        - recCmd_Change:
            Control: Rectangle@2.3.0
            Properties:
              X: =0
              Y: =Parent.Height - 64
              Width: =Parent.Width
              Height: =64
              Fill: =gTheme.Card
              BorderColor: =gTheme.Border
              BorderThickness: =1
        - btnSubmit_Change:
            Control: Classic/Button@2.2.0
            Properties:
              Text: ="Submit request"
              OnSelect: |-
                =With({err: Coalesce(
                        If(IsBlank(varApp), "Choose an application on the left."),
                        If(Len(Trim(txtJust_Change.Text)) < 10, "Business justification is required (10+ characters)."),
                        If(varOp = "exposeApi" && radUri_Change.Selected.Value = "Custom" && !IsMatch(Trim(txtCustomUri_Change.Text), "^(api://|https://)\S+$"), "The custom Application ID URI must start with api:// or https://"),
                        If(varOp = "exposeApi" && CountRows(Filter(colScopes, !IsMatch(Value, gValuePattern) || IsBlank(Trim(AdminName)) || IsBlank(Trim(AdminDesc)))) > 0, "Each scope needs a name, an admin consent display name and a description."),
                        If(varOp = "addAppRoles" && (CountRows(colRoles) = 0 || CountRows(Filter(colRoles, !IsMatch(Value, gValuePattern) || IsBlank(Trim(DisplayName)) || IsBlank(Trim(Description)))) > 0), "Add at least one role with a value, display name and description."),
                        If(varOp = "assignGroups" && CountRows(colAssign) = 0, "Add at least one role assignment."),
                        If(varOp = "createSP" && !IsBlank(varApp.ServicePrincipalId), "This app already has an enterprise application.")
                    )},
                    If(!IsBlank(err),
                        Notify(err, NotificationType.Warning),
                        Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
                        With({
                            type: Switch(varOp, "exposeApi", "exposeApi", "addAppRoles", "addAppRoles", "assignGroups", "assignGroupsToAppRoles", "createServicePrincipal"),
                            payload: Switch(varOp,
                                "exposeApi", JSON({applicationObjectId: varApp.ObjectId, applicationDisplayName: varApp.Title, identifierUriTemplate: If(radUri_Change.Selected.Value = "Custom", Trim(txtCustomUri_Change.Text), "api://{appId}"), scopes: ForAll(colScopes, {value: ThisRecord.Value, type: ThisRecord.Type, adminConsentDisplayName: ThisRecord.AdminName, adminConsentDescription: ThisRecord.AdminDesc})}, JSONFormat.Compact),
                                "addAppRoles", JSON({applicationObjectId: varApp.ObjectId, applicationDisplayName: varApp.Title, appRoles: ForAll(colRoles As r, {value: r.Value, displayName: r.DisplayName, description: r.Description, allowedMemberTypes: Switch(r.Members, "Applications", "Application", "Both", "User,Application", "User"), assignGroups: ForAll(Filter(colRoleGroups, RoleKey = r.Key) As g, {mode: g.Mode, id: g.GroupId, displayName: g.DisplayName, description: g.Description, ownerIds: g.OwnerIds})})}, JSONFormat.Compact),
                                "assignGroups", JSON({applicationObjectId: varApp.ObjectId, applicationDisplayName: varApp.Title, assignments: ForAll(colAssign, {appRoleId: ThisRecord.RoleId, appRoleValue: ThisRecord.RoleValue, mode: ThisRecord.Mode, id: ThisRecord.GroupId, displayName: ThisRecord.DisplayName, description: ThisRecord.Description, ownerIds: ThisRecord.OwnerIds})}, JSONFormat.Compact),
                                JSON({applicationObjectId: varApp.ObjectId, applicationDisplayName: varApp.Title, appRoleAssignmentRequired: tglAssign_Change.Value}, JSONFormat.Compact)
                            )
                        },
                            IfError(
                                Patch(EntraRequests, Defaults(EntraRequests), {
                                    Title: varReqId,
                                    RequestType: {Value: type},
                                    Status: {Value: "Submitted"},
                                    AppCatId: varApp.AppCatId,
                                    TargetDisplayName: varApp.Title,
                                    TargetObjectId: varApp.ObjectId,
                                    Justification: Trim(txtJust_Change.Text),
                                    TicketReference: Trim(txtTicket_Change.Text),
                                    PayloadJson: payload
                                }),
                                Notify("The request could not be submitted: " & FirstError.Message, NotificationType.Error),
                                Notify("Request " & varReqId & " submitted for approval.", NotificationType.Success); Set(varResetChange, true); Set(varSelectedReqId, Blank()); Navigate(scrMyRequests, ScreenTransition.Fade)
                            )
                        )
                    )
                )
              X: =360
              Y: =Parent.Height - 50
              Width: =170
              Height: =36
              Size: =11
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =4
              RadiusTopRight: =4
              RadiusBottomLeft: =4
              RadiusBottomRight: =4
              Fill: =gTheme.Primary
