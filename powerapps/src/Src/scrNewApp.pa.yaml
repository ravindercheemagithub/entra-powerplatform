            - htmlReview_NewApp:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =With({team: {Mode: "existing", GroupId: cmbTeam_NewApp.Selected.GroupId, DisplayName: cmbTeam_NewApp.Selected.Title, Description: "", OwnerIds: ""}},
                    "<div style='font-family:Segoe UI, sans-serif; font-size:13px; color:#323130; line-height:1.5'>" &
                    "<table style='border-collapse:collapse; width:100%'>" &
                    "<tr><td style='color:#605e5c; width:220px; padding:4px 0'>Display name</td><td><b>" & lblFullName_NewApp.Text & "</b></td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>appCatID · environment · BoR short name</td><td>" & Upper(Trim(txtAppCatId_NewApp.Text)) & " · " & ddEnv_NewApp.Selected.Value & " · " & Trim(txtBorShort_NewApp.Text) & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Owning team</td><td>" & team.DisplayName & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Account types</td><td>" & radAudience_NewApp.Selected.Value & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Redirect URIs</td><td>" & If(ddPlatform_NewApp.Selected.Value = "None", "none", ddPlatform_NewApp.Selected.Value & ": " & txtRedirect_NewApp.Text) & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Expose an API</td><td>" & If(chkExpose_NewApp.Value, If(radUri_NewApp.Selected.Value = "Custom", txtCustomUri_NewApp.Text, "api://{appId}") & If(CountRows(colScopes) > 0, " — scopes: " & Concat(colScopes, Value, ", "), ""), "no") & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Groups claim</td><td>" & ddGroupsClaim_NewApp.Selected.Value & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0; vertical-align:top'>App roles</td><td>" &
                        If(CountRows(colRoles) = 0, "none", "<ul style='margin:0; padding-left:18px'>" &
                            Concat(ForAll(colRoles As r, {t: "<li><b>" & r.Value & "</b> → " & Coalesce(Concat(Filter(colRoleGroups, RoleKey = r.Key), DisplayName, ", "), "<i>no groups</i>") & "</li>"}), t) & "</ul>") & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Enterprise app</td><td>" & If(tglCreateSp_NewApp.Value || CountRows(colRoleGroups) > 0, "yes" & If(tglAssign_NewApp.Value, ", assignment required", ", assignment not required"), "no") & "</td></tr>" &
                    "<tr><td style='color:#605e5c; padding:4px 0'>Owners</td><td>none (access is managed through the owning team and role groups)</td></tr>" &
                    "</table>" &
                    "<p style='margin-top:14px; padding:10px 12px; background:#ebf3fc; border-left:3px solid #0f6cbd'><b>What happens next</b><br>" &
                    "1. Your manager approves in Outlook / Teams.  2. The Entra ID team approves.  3. The app registration, roles, role assignments and enterprise app are created automatically and appear under My requests.</p>" &
                    "</div>"
                    )
