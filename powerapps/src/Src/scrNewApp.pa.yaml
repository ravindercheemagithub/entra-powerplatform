            Control: Label@2.5.1
            Properties:
              Text: =Upper(Trim(txtAppCatId_NewApp.Text)) & "-" & Left(ddEnv_NewApp.Selected.Value, 1) & "-" & Trim(txtBorShort_NewApp.Text) & "-" & Trim(txtAppName_NewApp.Text)
              X: =0
              Y: =0
              Width: =10
              Height: =10
              Size: =11
              Font: =Font.'Segoe UI'
              Color: =gTheme.Text
              FontWeight: =FontWeight.Normal
              PaddingLeft: =0
              PaddingRight: =0
              Visible: =false
        - lblErr1_NewApp:
            Control: Label@2.5.1
            Properties:
              Text: |-
                =Coalesce(
                    If(!IsMatch(Upper(Trim(txtAppCatId_NewApp.Text)), gAppCatPattern), "App BoR ID (appCatID) looks like APPCAT-001."),
                    If(!IsMatch(Trim(txtBorShort_NewApp.Text), "^[A-Za-z0-9]{2,20}$"), "App BoR short name: 2–20 letters or digits, no spaces."),
                    If(!IsMatch(Trim(txtAppName_NewApp.Text), "^[A-Za-z0-9][A-Za-z0-9 ._-]{1,79}$"), "Display name: enter the free-text part after the prefix (2–80 letters, digits, spaces, . _ -)."),
                    If(Len(lblFullName_NewApp.Text) > 120, "The full display name is longer than 120 characters; shorten the free-text part."),
                    If(IsBlank(cmbTeam_NewApp.Selected.GroupId), "Choose the owning team. Not listed? Use 'Group not listed? Add an existing group'."),
                    If(Len(Trim(txtJustification_NewApp.Text)) < 10, "Business justification is required (10+ characters)."),
                    If(ddPlatform_NewApp.Selected.Value <> "None" && !IsMatch(Trim(txtRedirect_NewApp.Text), "^\S+$"), "Redirect URIs: no spaces; separate several with ;")
                )
              X: =0
              Y: =0
              Width: =10
              Height: =10
              Size: =11
              Font: =Font.'Segoe UI'
              Color: =gTheme.Text
              FontWeight: =FontWeight.Normal
              PaddingLeft: =0
              PaddingRight: =0
              Visible: =false
        - lblErr2_NewApp:
            Control: Label@2.5.1
            Properties:
              Text: |-
                =Coalesce(
                    If(chkExpose_NewApp.Value && radUri_NewApp.Selected.Value = "Custom" && !IsMatch(Trim(txtCustomUri_NewApp.Text), "^(api://|https://)\S+$"), "The custom Application ID URI must start with api:// or https://"),
                    If(CountRows(Filter(colScopes, !IsMatch(Value, gValuePattern) || IsBlank(Trim(AdminName)) || IsBlank(Trim(AdminDesc)))) > 0, "Each scope needs a name (letters, digits, . _ -), an admin consent display name and a description."),
                    If(CountRows(colScopes) <> CountRows(Distinct(colScopes, Value)), "Scope names must be unique.")
                )
              X: =0
              Y: =0
              Width: =10
              Height: =10
              Size: =11
              Font: =Font.'Segoe UI'
              Color: =gTheme.Text
              FontWeight: =FontWeight.Normal
              PaddingLeft: =0
              PaddingRight: =0
              Visible: =false
        - lblErr3_NewApp:
            Control: Label@2.5.1
            Properties:
              Text: |-
                =Coalesce(
                    If(CountRows(Filter(colRoles, !IsMatch(Value, gValuePattern) || IsBlank(Trim(DisplayName)) || IsBlank(Trim(Description)))) > 0, "Each role needs a value (letters, digits, . _ -), a display name and a description."),
                    If(CountRows(colRoles) <> CountRows(Distinct(colRoles, Value)), "Role values must be unique.")
                )
              X: =0
              Y: =0
              Width: =10
              Height: =10
              Size: =11
              Font: =Font.'Segoe UI'
              Color: =gTheme.Text
              FontWeight: =FontWeight.Normal
              PaddingLeft: =0
              PaddingRight: =0
              Visible: =false
        - lblErrAll_NewApp:
            Control: Label@2.5.1
            Properties:
              Text: =Coalesce(lblErr1_NewApp.Text, lblErr2_NewApp.Text, lblErr3_NewApp.Text)
              X: =0
              Y: =0
              Width: =10
              Height: =10
              Size: =11
              Font: =Font.'Segoe UI'
              Color: =gTheme.Text
              FontWeight: =FontWeight.Normal
              PaddingLeft: =0
              PaddingRight: =0
              Visible: =false
