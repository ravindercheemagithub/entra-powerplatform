        - btnSubmit_NewApp:
            Control: Classic/Button@2.2.0
            Properties:
              Text: ="Submit request"
              OnSelect: |-
                =With({err: lblErrAll_NewApp.Text},
                    If(!IsBlank(err),
                        Set(varStepError, err); Notify(err, NotificationType.Warning),
                        Set(varStepError, "");
                        Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
                        IfError(
                            Patch(EntraRequests, Defaults(EntraRequests), {
                                Title: varReqId,
                                RequestType: {Value: "createAppRegistration"},
                                Status: {Value: "Submitted"},
                                AppCatId: Upper(Trim(txtAppCatId_NewApp.Text)),
                                TargetDisplayName: lblFullName_NewApp.Text,
                                Justification: Trim(txtJustification_NewApp.Text),
                                TicketReference: Trim(txtTicket_NewApp.Text),
                                PayloadJson: With({team: {Mode: "existing", GroupId: cmbTeam_NewApp.Selected.GroupId, DisplayName: cmbTeam_NewApp.Selected.Title, Description: "", OwnerIds: ""}},
                                JSON({
                                    displayName: lblFullName_NewApp.Text,
                                    appEnv: Left(ddEnv_NewApp.Selected.Value, 1),
                                    borShortName: Trim(txtBorShort_NewApp.Text),
                                    nameText: Trim(txtAppName_NewApp.Text),
                                    description: Substitute(Substitute(Substitute(Substitute(Trim(txtDescription_NewApp.Text), Char(13), ""), Char(10), " "), """", "'"), "\", "/"),
                                    signInAudience: If(radAudience_NewApp.Selected.Value = "Multitenant", "AzureADMultipleOrgs", "AzureADMyOrg"),
                                    owningGroup: {mode: "existing", id: team.GroupId, displayName: team.DisplayName},
                                    redirectUrisWeb: If(ddPlatform_NewApp.Selected.Value = "Web", Trim(txtRedirect_NewApp.Text), ""),
                                    redirectUrisSpa: If(ddPlatform_NewApp.Selected.Value = "Single-page app", Trim(txtRedirect_NewApp.Text), ""),
                                    exposeApi: {
                                        enabled: chkExpose_NewApp.Value,
                                        identifierUriTemplate: If(radUri_NewApp.Selected.Value = "Custom", Trim(txtCustomUri_NewApp.Text), "api://{appId}"),
                                        scopes: If(chkExpose_NewApp.Value, ForAll(colScopes, {value: ThisRecord.Value, type: ThisRecord.Type, adminConsentDisplayName: ThisRecord.AdminName, adminConsentDescription: ThisRecord.AdminDesc}), Filter(ForAll(colScopes, {value: ThisRecord.Value, type: ThisRecord.Type, adminConsentDisplayName: ThisRecord.AdminName, adminConsentDescription: ThisRecord.AdminDesc}), false))
                                    },
                                    optionalClaimsIdToken: Concat(Filter(Table({n: "email", on: chkIdEmail_NewApp.Value}, {n: "upn", on: chkIdUpn_NewApp.Value}, {n: "given_name", on: chkIdGiven_NewApp.Value}, {n: "family_name", on: chkIdFamily_NewApp.Value}), on), n, ","),
                                    optionalClaimsAccessToken: Concat(Filter(Table({n: "email", on: chkAtEmail_NewApp.Value}, {n: "upn", on: chkAtUpn_NewApp.Value}, {n: "idtyp", on: chkAtIdtyp_NewApp.Value}), on), n, ","),
                                    groupMembershipClaims: ddGroupsClaim_NewApp.Selected.Value,
                                    appRoles: ForAll(colRoles As r, {
                                        value: r.Value, displayName: r.DisplayName, description: r.Description,
                                        allowedMemberTypes: Switch(r.Members, "Applications", "Application", "Both", "User,Application", "User"),
                                        assignGroups: ForAll(Filter(colRoleGroups, RoleKey = r.Key) As g, {mode: "existing", id: g.GroupId, displayName: g.DisplayName})
                                    }),
                                    createServicePrincipal: tglCreateSp_NewApp.Value || CountRows(colRoleGroups) > 0,
                                    appRoleAssignmentRequired: tglAssign_NewApp.Value,
                                    tags: Trim(txtTags_NewApp.Text)
                                }, JSONFormat.Compact)
                                )
                            }),
                            Notify("The request could not be submitted: " & FirstError.Message, NotificationType.Error),
                            Notify("Request " & varReqId & " submitted. Your manager has been asked to approve it.", NotificationType.Success);
                            Set(varResetNewApp, true);
                            Set(varSelectedReqId, Blank());
                            Navigate(scrMyRequests, ScreenTransition.Fade)
                        )
                    )
                )
