              OnTimerEnd: |-
                =Set(varAccPolls, varAccPolls + 1);
                Refresh(EntraRequests);
                With({r: LookUp(EntraRequests, ID = varAccRec.ID)},
                    If(
                        r.Status.Value = "Completed",
