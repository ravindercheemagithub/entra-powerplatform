              BorderColor: =gTheme.Border
              BorderThickness: =1
        - btnSubmit_TagGroup:
            Control: Classic/Button@2.2.0
            Properties:
              Text: ="Change owning group"
              OnSelect: |-
                =If(
                    !IsMatch(Lower(Trim(txtApp_TagGroup.Text)), "^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$"),
                        Notify("App registration: enter its Application (client) ID or Object ID.", NotificationType.Warning),
                    !IsMatch(Lower(Trim(txtGroup_TagGroup.Text)), "^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$"),
                        Notify("Group: enter its Object ID, or pick one of your groups.", NotificationType.Warning),
                    varTagBusy,
                        Notify("Still working on the previous request, one moment.", NotificationType.Information),
                    Set(varReqId, "REQ-" & Text(Now(), "yymm") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 6)));
                    IfError(
                        Set(varTagRec, Patch(EntraRequests, Defaults(EntraRequests), {
                            Title: varReqId,
                            RequestType: {Value: "tagOwnerGroup"},
                            Status: {Value: "Submitted"},
                            TargetDisplayName: Lower(Trim(txtApp_TagGroup.Text)),
                            TargetObjectId: Lower(Trim(txtApp_TagGroup.Text)),
                            Justification: "Hand the app registration to group " & Lower(Trim(txtGroup_TagGroup.Text)),
                            PayloadJson: JSON({app: Lower(Trim(txtApp_TagGroup.Text)), group: Lower(Trim(txtGroup_TagGroup.Text))}, JSONFormat.Compact)
                        })),
                        Notify("The request could not be submitted: " & FirstError.Message, NotificationType.Error),
                        Set(varTagPolls, 0); Set(varTagBusy, true)
                    )
                )
              X: =24
              Y: =Parent.Height - 50
              Width: =210
              Height: =36
              Size: =11
              Font: =Font.'Segoe UI'
