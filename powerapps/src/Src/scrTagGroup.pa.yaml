              Color: =RGBA(255, 255, 255, 1)
              HoverFill: =gTheme.PrimaryHover
              PressedFill: =gTheme.PrimaryHover
              BorderThickness: =0
              HoverColor: =RGBA(255, 255, 255, 1)
              DisplayMode: =If(varTagBusy, DisplayMode.Disabled, DisplayMode.Edit)
        - btnBack_TagGroup:
            Control: Classic/Button@2.2.0
            Properties:
              Text: ="Back"
              OnSelect: =Back()
              X: =244
              Y: =Parent.Height - 50
              Width: =120
              Height: =36
              Size: =11
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =4
              RadiusTopRight: =4
              RadiusBottomLeft: =4
              RadiusBottomRight: =4
              Fill: =RGBA(0, 0, 0, 0)
              Color: =gTheme.Text
              HoverFill: =gTheme.Bg
              PressedFill: =gTheme.Bg
              BorderColor: =gTheme.Border
              BorderThickness: =1
              HoverColor: =gTheme.Text
              HoverBorderColor: =gTheme.Muted
        - tmrTag_TagGroup:
            Control: Timer@2.1.0
            Properties:
              Duration: =3000
              Repeat: =true
              AutoStart: =false
              Start: =varTagBusy
              OnTimerEnd: |-
                =Set(varTagPolls, varTagPolls + 1);
                Refresh(EntraRequests);
                With({r: LookUp(EntraRequests, ID = varTagRec.ID)},
                    If(
                        r.Status.Value = "Completed",
                            Set(varTagBusy, false); Reset(txtApp_TagGroup); Reset(ddMyGroup_TagGroup); Reset(txtGroup_TagGroup);
                            Notify("Done: " & r.TargetDisplayName & " is now owned by group " & Text(ParseJSON(r.ResultJson).groupDisplayName) & ".", NotificationType.Success),
                        r.Status.Value = "Failed",
                            Set(varTagBusy, false);
                            Notify(Coalesce(r.ErrorMessage, "Not changed."), NotificationType.Error),
                        varTagPolls >= 40,
                            Set(varTagBusy, false);
                            Notify("Still working. The result will appear in the list below.", NotificationType.Information)
                    )
                )
              Visible: =false
              X: =0
              Y: =0
              Width: =10
              Height: =10
